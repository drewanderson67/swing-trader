<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SwingTrader</title>
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SwingTrader">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 24 24"><path d="M3 16l5-6 4 4 5-7 4 4"/></svg>SwingTrader <span class="ver" id="ver"></span></div>
  <div class="mkt"><span class="dot" id="mktDot"></span><span id="mktTxt"></span><button class="chip" id="runBtn" data-act="run"></button></div>
</header>
<nav class="tabs" id="tabs">
  <button data-go="portfolio" class="on"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg><span>Portfolio</span></button>
  <button data-go="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></button>
  <button data-go="log"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Log</span></button>
  <button data-go="profiles"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/><path d="M19 5L5 19"/></svg><span>Profiles</span></button>
  <button data-go="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></button>
</nav>
<main>
  <section id="v-portfolio" class="view on">
    <div class="card summary" id="summary"></div>
    <div id="bots" class="bots"></div>
    <h3 class="sec">Recent activity</h3>
    <div id="recent" class="card list"></div>
  </section>
  <section id="v-new" class="view"></section>
  <section id="v-log" class="view"></section>
  <section id="v-profiles" class="view"></section>
  <section id="v-settings" class="view"></section>
</main>
<div id="sheet" class="sheet hidden"><div class="sheet-bd" data-close></div><div class="sheet-panel" id="sheetPanel"></div></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
